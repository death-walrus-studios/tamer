name: Release

# Pushing a tag like v1.0.0 runs the test harness, builds the zip, uploads it to CurseForge, and
# makes a GitHub release. Running it by hand, or on a push or pull request, only tests and builds.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  # Versions before 1.0.0 are test versions: a Beta on CurseForge and a pre-release on GitHub.
  # CurseForge's name for the client version. Change this when the client's version changes,
  # along with ## Interface in Tamer.toc.
  GAME_VERSION: "1.60.1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the test harness
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          luajit tools/harness/harness.lua

      - name: Check the tag matches the TOC
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^## Version:[[:space:]]*//p' addon/Tamer/Tamer.toc | tr -d '\r')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match ## Version: $version"
            exit 1
          fi

      - name: Build the zip
        shell: pwsh
        run: ./tools/build-release.ps1

      - name: Check the zip
        run: |
          zip_file="$(ls dist/Tamer-*.zip)"
          unzip -l "$zip_file" | grep -q 'Tamer/Core.lua' || { echo "::error::The zip has the wrong layout"; exit 1; }
          echo "ZIP_FILE=$zip_file" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Tamer-zip
          path: dist/Tamer-*.zip

      - name: Take the notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version and every one before it, with their headings, so the notes read
          # like a full changelog.
          awk -v heading="## $version" '$0 == heading { found = 1 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::error::Set the CF_API_TOKEN secret and CF_PROJECT_ID variable (see docs/RELEASING.md)"
            exit 1
          fi
          api="https://wow.curseforge.com/api"
          ids="$(curl -fsS -H "X-Api-Token: $CF_API_TOKEN" "$api/game/versions" |
            jq -c --arg name "$GAME_VERSION" '[.[] | select(.name == $name) | .id]')"
          if [ "$(jq length <<< "$ids")" != 1 ]; then
            echo "::error::Expected one CurseForge game version named $GAME_VERSION, found: $ids"
            exit 1
          fi
          release_type=release
          case "$GITHUB_REF_NAME" in v0.*) release_type=beta ;; esac
          metadata="$(jq -n --rawfile notes notes.md --arg type "$release_type" --arg name "Tamer ${GITHUB_REF_NAME#v}" --argjson ids "$ids" \
            '{changelog: $notes, changelogType: "markdown", displayName: $name, gameVersions: $ids, releaseType: $type}')"
          curl -sS --fail-with-body -H "X-Api-Token: $CF_API_TOKEN" \
            --form-string "metadata=$metadata" -F "file=@$ZIP_FILE" \
            "$api/projects/$CF_PROJECT_ID/upload-file"

      - name: Make the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$ZIP_FILE" --title "Tamer ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease

      # After everything else, and allowed to fail, so a problem at Wago never holds up CurseForge.
      - name: Upload to Wago
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WAGO_PROJECT_ID: 56nbo569
        run: |
          if [ -z "$WAGO_API_TOKEN" ]; then
            echo "::warning::Skipped Wago: no WAGO_API_TOKEN secret (see docs/RELEASING.md)"
            exit 0
          fi
          stability=stable
          case "$GITHUB_REF_NAME" in v0.*) stability=beta ;; esac
          metadata="$(jq -n --rawfile notes notes.md --arg label "${GITHUB_REF_NAME#v}" --arg stability "$stability" --arg patch "$GAME_VERSION" \
            '{label: $label, stability: $stability, changelog: $notes, supported_forever_patches: [$patch]}')"
          curl -sS --fail-with-body -H "Authorization: Bearer $WAGO_API_TOKEN" -H "Accept: application/json" \
            --form-string "metadata=$metadata" -F "file=@$ZIP_FILE" \
            "https://addons.wago.io/api/projects/$WAGO_PROJECT_ID/version"
